# Mode gelap untuk aplikasi GTK3 (Thunar, dialog portal, dll).
# Nama tema/ikon/font TIDAK ditulis di sini: di Wayland GTK membacanya dari gsettings
# (org.gnome.desktop.interface), dan hook template gtk Noctalia yang mengaturnya
# (gtk-theme = adw-gtk3-dark bila paket adw-gtk-theme terpasang, color-scheme = prefer-dark).
# Warna tema Noctalia masuk lewat ~/.config/gtk-3.0/gtk.css -> noctalia.css (file render, di luar repo).
[Settings]
gtk-application-prefer-dark-theme=1
