# mpv — ringan, decode di GPU, tampilan bersih. Referensi: https://mpv.io/manual/stable/
# Berlaku untuk semua mesin: GPU yang dipakai = GPU compositor (Intel iGPU di dynarch, AMD iGPU di legionarch hybrid).
vo=gpu-next                 # renderer modern (libplacebo)
hwdec=vaapi                 # decode VA-API di GPU compositor: driver iHD (intel-media-driver) di Intel, radeonsi (libva-mesa-driver) di AMD.
                            # Bukan "auto-safe": di mesin hybrid itu bisa memilih vulkan-copy lewat NVIDIA, GPU yang salah.
profile=high-quality
gpu-api=opengl             # EGL di GPU compositor. Vulkan sengaja tidak dipakai: di mesin hybrid ICD bisa mendarat di NVIDIA.
                            # Uji: mpv --length=2 --really-quiet --msg-level=vd=v,vo=v <file> 2>&1 | grep -E "GL_RENDERER|hardware decoding"
# tampilan
osc=yes                     # kontrol di layar saat mouse bergerak
osd-bar=no
osd-font='MesloLGS Nerd Font'
osd-font-size=28
border=no                   # tanpa dekorasi jendela (Hyprland yang mengatur)
keep-open=yes               # jangan langsung tutup di akhir file
save-position-on-quit=yes
autofit-larger=85%x85%      # jendela mengambang maksimal 85% layar
# audio
volume=80
volume-max=150
audio-file-auto=fuzzy
# subtitle
sub-auto=fuzzy
sub-font='MesloLGS Nerd Font'
sub-font-size=40
sub-border-size=2
# screenshot mpv (S)
screenshot-format=png
screenshot-directory=~/Pictures/Screenshots
screenshot-template='mpv-%F-%p'
# youtube dan stream (butuh yt-dlp)
ytdl-format=bestvideo[height<=?1080]+bestaudio/best
