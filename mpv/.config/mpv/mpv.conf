# mpv — ringan, decode di GPU, tampilan bersih. Referensi: https://mpv.io/manual/stable/
vo=gpu-next                 # renderer modern (Vulkan/OpenGL)
hwdec=vaapi                 # decode VA-API di GPU AMD (auto-safe memilih vulkan-copy = NVIDIA di mesin ini)
profile=high-quality
gpu-api=opengl             # EGL di GPU yang dipakai compositor (AMD); Vulkan di sini hanya melihat NVIDIA tanpa vulkan-radeon
# tampilan
osc=yes                     # kontrol di layar saat mouse bergerak
osd-bar=no
osd-font='MesloLGS Nerd Font'
osd-font-size=28
border=no                   # tanpa dekorasi jendela (Hyprland yang mengatur)
keep-open=yes               # jangan langsung tutup di akhir file
save-position-on-quit=yes
autofit-larger=85%x85%      # jendela mengambang maksimal 85% layar
# audio
volume=80
volume-max=150
audio-file-auto=fuzzy
# subtitle
sub-auto=fuzzy
sub-font='MesloLGS Nerd Font'
sub-font-size=40
sub-border-size=2
# screenshot mpv (S)
screenshot-format=png
screenshot-directory=~/Pictures/Screenshots
screenshot-template='mpv-%F-%p'
# youtube dan stream (butuh yt-dlp)
ytdl-format=bestvideo[height<=?1080]+bestaudio/best
