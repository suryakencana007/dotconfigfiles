# Behringer UMC202HD 192k (USB 1397:0507) - force the ALSA "pro-audio" profile.
#
# WirePlumber's auto selection (device/find-best-profile) skips "pro-audio"
# profiles on purpose, and this card only offers "off" and "pro-audio".
# Without this rule the interface can end up stuck on "off" after a replug:
# PipeWire then exposes no sink/source and apps report it as "not detected".
# Setting device.profile makes the choice deterministic and independent of the
# stored default-profile state in ~/.local/state/wireplumber.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-BEHRINGER_UMC202HD.*"
      }
      {
        device.vendor.id = "0x1397"
        device.product.id = "0x0507"
      }
    ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
      }
    }
  }
]
