# Podman short-name resolution.
#
# On a machine that ships no /etc/containers/registries.conf, podman refuses
# unqualified image names:
#   short-name "postgres:17" did not resolve to an alias and no
#   containers-registries.conf(5) was found
# Listing Docker Hub here makes `postgres:17`, `redis:8`, `nats:2.12` and
# friends resolve to docker.io/library/<name>:<tag> — what Docker and the
# Docker Compose files people write (and podman-compose runs) expect.
#
# Per-machine overrides: ~/.config/containers/registries.conf.d/*.conf
unqualified-search-registries = ["docker.io"]

# Keep unqualified names working rather than demanding a fully-qualified name.
short-name-mode = "permissive"
