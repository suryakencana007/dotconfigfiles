# Flag Brave (launcher brave-bin membaca file ini; baris # diabaikan).
# Password dan cookie disimpan di keyring (gnome-keyring lewat libsecret). Tanpa flag ini Brave di Hyprland memilih
# penyimpanan "basic" (kunci statis di kode Chromium), karena Hyprland bukan desktop yang ia kenali.
--password-store=gnome-libsecret
# Ekstensi WhatsApp Slim (resi/brave-extensions, dari Omarchy): daftar chat dilipat jadi deretan avatar di jendela sempit,
# WhatsApp Web ikut tema sistem. Disalin ke path tetap ini oleh resi-shell install/update (brave-flags tidak mengenal ~).
--load-extension=/usr/local/share/resi-shell/brave-extensions/whatsapp-slim
