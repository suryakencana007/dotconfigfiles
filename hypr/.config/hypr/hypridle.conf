# hypridle hanya untuk dua kait yang tidak bisa dilakukan Noctalia setelah lock screen bawaannya dimatikan:
#   - loginctl lock-session  -> hyprlock (lock_cmd), satu instance
#   - sebelum suspend/hibernate (PrepareForSleep: tutup lid, menu, systemctl suspend) -> kunci dulu, baru tidur
# Waktu idle (kunci 10 menit, layar mati 11 menit) tetap diatur Noctalia lewat idle.toml, jadi tidak ada listener di sini.
# Dijalankan autostart.lua. Referensi: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = ~/.local/bin/hypr-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}
