# Lock screen (hyprlock). Dipanggil lewat ~/.local/bin/hypr-lock: Super+Ctrl+L, menu System, panel sesi Noctalia,
# idle 10 menit (idle.toml), tutup lid, dan hypridle sebelum suspend.
# Warna mengikuti tema Noctalia: hyprlock-colors.conf dirender dari template (noctalia/templates/hyprlock.conf);
# hyprlock-colors.default.conf adalah nilai awal sebelum Noctalia pernah merender (keduanya disalin resi-shell).
# Latar = tangkapan layar desktop saat ini yang diblur (sama rasanya dengan lock screen Noctalia sebelumnya).
# Font sama dengan desktop: JetBrainsMono Nerd Font. Referensi: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

source = ~/.config/hypr/hyprlock-colors.default.conf
source = ~/.config/hypr/hyprlock-colors.conf

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    pam {
        enabled = true
    }
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.7
    vibrancy = 0.15
}

# tint tipis di atas blur supaya teks terbaca di wallpaper terang
shape {
    monitor =
    size = 100%, 100%
    color = $tint
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# ---- jam & tanggal ----
label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 96
    font_family = $font
    position = 0, 170
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B %Y"
    color = $fg_dim
    font_size = 18
    font_family = $font
    position = 0, 85
    halign = center
    valign = center
    zindex = 1
}

# ---- user ----
label {
    monitor =
    text = 󰀄  $USER
    color = $fg_dim
    font_size = 14
    font_family = $font
    position = 0, 10
    halign = center
    valign = center
    zindex = 1
}

# ---- kotak password (lebar sama dengan kotak login kompak sebelumnya: 480) ----
input-field {
    monitor =
    size = 480, 54
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    rounding = 12
    inner_color = $box
    outer_color = $border
    check_color = $accent
    fail_color = $error
    capslock_color = $error
    font_color = $fg
    font_family = $font
    fade_on_empty = false
    placeholder_text = Enter password
    fail_text = $FAIL ($ATTEMPTS)
    hide_input = false
    position = 0, -45
    halign = center
    valign = center
    zindex = 1
}

# ---- pojok bawah: nama mesin (kiri), baterai (kanan; kosong di desktop) ----
label {
    monitor =
    text = cmd[update:600000] echo "󰍹  $(cat /etc/hostname)"
    color = $fg_dim
    font_size = 13
    font_family = $font
    position = 36, 30
    halign = left
    valign = bottom
    zindex = 1
}

label {
    monitor =
    text = cmd[update:30000] ~/.local/bin/hypr-lock --battery
    color = $fg_dim
    font_size = 13
    font_family = $font
    position = -36, 30
    halign = right
    valign = bottom
    zindex = 1
}
