# Lock screen (hyprlock). Dipanggil lewat ~/.local/bin/hypr-lock: Super+Ctrl+L, menu System, panel sesi Noctalia,
# idle 10 menit (idle.toml), tutup lid, dan hypridle sebelum suspend. Bagian ini = inti (latar, tint, kotak password);
# widget lain dipilih per mesin lewat hyprlock-widgets.conf (lihat akhir file).
# Warna mengikuti tema Noctalia: hyprlock-colors.conf dirender dari template (noctalia/templates/hyprlock.conf);
# hyprlock-colors.default.conf adalah nilai awal sebelum Noctalia pernah merender (keduanya disalin resi-shell).
# Latar = tangkapan layar desktop saat ini yang diblur (sama rasanya dengan lock screen Noctalia sebelumnya).
# Font sama dengan desktop: JetBrainsMono Nerd Font. Referensi: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

source = ~/.config/hypr/hyprlock-colors.default.conf
source = ~/.config/hypr/hyprlock-colors.conf

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    pam {
        enabled = true
    }
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.7
    vibrancy = 0.15
}

# tint tipis di atas blur supaya teks terbaca di wallpaper terang
shape {
    monitor =
    size = 100%, 100%
    color = $tint
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# ---- kotak password (lebar sama dengan kotak login kompak sebelumnya: 480) ----
input-field {
    monitor =
    size = 480, 54
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    rounding = 12
    inner_color = $box
    outer_color = $border
    check_color = $accent
    fail_color = $error
    capslock_color = $error
    font_color = $fg
    font_family = $font
    fade_on_empty = false
    placeholder_text = Enter password
    fail_text = $FAIL ($ATTEMPTS)
    hide_input = false
    position = 0, -45
    halign = center
    valign = center
    zindex = 1
}

# ---- widget pilihan (jam, tanggal, user, baterai, cuaca, ...) ----
# Daftar yang aktif per mesin: ~/.config/hypr/hyprlock-widgets.conf (dibuat hypr-lock; Setup > Lock screen > Widgets).
# Tiap widget = satu file di ~/.config/hypr/hyprlock.d/ yang memakai variabel warna/font di atas.
source = ~/.config/hypr/hyprlock-widgets.conf
