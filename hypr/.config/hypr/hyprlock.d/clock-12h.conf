# Jam 12 jam (AM/PM), menggantikan posisi jam 24 jam.
# Warna/font dari hyprlock.conf ($fg, $fg_dim, $font, ...). Aktifkan lewat Setup > Lock screen > Widgets (hypr-lock widgets).
label {
    monitor =
    font_family = $font
    text = $TIME12
    color = $fg
    font_size = 80
    position = 0, 170
    halign = center
    valign = center
    zindex = 1
}
