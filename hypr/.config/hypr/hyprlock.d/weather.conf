# Cuaca dari cache Noctalia (lokasi di Settings Noctalia), pojok kanan atas.
# Warna/font dari hyprlock.conf ($fg, $fg_dim, $font, ...). Aktifkan lewat Setup > Lock screen > Widgets (hypr-lock widgets).
label {
    monitor =
    font_family = $font
    text = cmd[update:300000] ~/.local/bin/hypr-lock --weather
    color = $fg_dim
    font_size = 14
    position = -36, -30
    halign = right
    valign = top
    zindex = 1
}
