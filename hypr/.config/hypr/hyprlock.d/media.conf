# Lagu yang sedang diputar (playerctl), atas tengah; kosong bila tidak ada yang diputar.
# Warna/font dari hyprlock.conf ($fg, $fg_dim, $font, ...). Aktifkan lewat Setup > Lock screen > Widgets (hypr-lock widgets).
label {
    monitor =
    font_family = $font
    text = cmd[update:5000] ~/.local/bin/hypr-lock --media
    color = $fg_dim
    font_size = 14
    position = 0, -40
    halign = center
    valign = top
    zindex = 1
}
