# Nama user tepat di atas kotak password.
# Warna/font dari hyprlock.conf ($fg, $fg_dim, $font, ...). Aktifkan lewat Setup > Lock screen > Widgets (hypr-lock widgets).
label {
    monitor =
    font_family = $font
    text = 󰀄  $USER
    color = $fg_dim
    font_size = 14
    position = 0, 10
    halign = center
    valign = center
    zindex = 1
}
