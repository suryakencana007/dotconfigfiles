# Tanggal lengkap di bawah jam (bahasa mengikuti LANG).
# Warna/font dari hyprlock.conf ($fg, $fg_dim, $font, ...). Aktifkan lewat Setup > Lock screen > Widgets (hypr-lock widgets).
label {
    monitor =
    font_family = $font
    text = cmd[update:60000] date +"%A, %-d %B %Y"
    color = $fg_dim
    font_size = 18
    position = 0, 85
    halign = center
    valign = center
    zindex = 1
}
