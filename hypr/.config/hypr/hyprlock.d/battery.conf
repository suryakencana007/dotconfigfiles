# Baterai dengan ikon, pojok kanan bawah (kosong di desktop tanpa baterai).
# Warna/font dari hyprlock.conf ($fg, $fg_dim, $font, ...). Aktifkan lewat Setup > Lock screen > Widgets (hypr-lock widgets).
label {
    monitor =
    font_family = $font
    text = cmd[update:30000] ~/.local/bin/hypr-lock --battery
    color = $fg_dim
    font_size = 13
    position = -36, 30
    halign = right
    valign = bottom
    zindex = 1
}
