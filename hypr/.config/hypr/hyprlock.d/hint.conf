# Petunjuk kecil di bawah kotak password.
# Warna/font dari hyprlock.conf ($fg, $fg_dim, $font, ...). Aktifkan lewat Setup > Lock screen > Widgets (hypr-lock widgets).
label {
    monitor =
    font_family = $font
    text = Type your password and press Enter
    color = $fg_dim
    font_size = 12
    position = 0, -100
    halign = center
    valign = center
    zindex = 1
}
