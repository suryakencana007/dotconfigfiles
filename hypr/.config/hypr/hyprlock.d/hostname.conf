# Nama mesin, pojok kiri bawah.
# Warna/font dari hyprlock.conf ($fg, $fg_dim, $font, ...). Aktifkan lewat Setup > Lock screen > Widgets (hypr-lock widgets).
label {
    monitor =
    font_family = $font
    text = cmd[update:600000] echo "󰍹  $(cat /etc/hostname)"
    color = $fg_dim
    font_size = 13
    position = 36, 30
    halign = left
    valign = bottom
    zindex = 1
}
