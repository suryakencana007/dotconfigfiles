# Jam 24 jam, besar, di atas kotak password.
# Warna/font dari hyprlock.conf ($fg, $fg_dim, $font, ...). Aktifkan lewat Setup > Lock screen > Widgets (hypr-lock widgets).
label {
    monitor =
    font_family = $font
    text = $TIME
    color = $fg
    font_size = 96
    position = 0, 170
    halign = center
    valign = center
    zindex = 1
}
