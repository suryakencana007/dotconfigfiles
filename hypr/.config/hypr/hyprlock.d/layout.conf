# Tata letak keyboard aktif, tengah bawah.
# Warna/font dari hyprlock.conf ($fg, $fg_dim, $font, ...). Aktifkan lewat Setup > Lock screen > Widgets (hypr-lock widgets).
label {
    monitor =
    font_family = $font
    text = 󰌌  $LAYOUT
    color = $fg_dim
    font_size = 12
    position = 0, 30
    halign = center
    valign = bottom
    zindex = 1
}
