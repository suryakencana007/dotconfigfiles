# Foto profil ~/.face (bulat) di atas jam. Aktifkan hanya bila ~/.face ada.
# Warna/font dari hyprlock.conf ($fg, $fg_dim, $font, ...). Aktifkan lewat Setup > Lock screen > Widgets (hypr-lock widgets).
image {
    monitor =
    path = ~/.face
    size = 96
    rounding = -1
    border_size = 2
    border_color = $border
    position = 0, 300
    halign = center
    valign = center
    zindex = 1
}
