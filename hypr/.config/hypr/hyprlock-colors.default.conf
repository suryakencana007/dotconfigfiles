# Warna awal hyprlock (netral gelap) sampai Noctalia merender ~/.config/hypr/hyprlock-colors.conf dari temanya.
# Nama variabel sama dengan template noctalia/templates/hyprlock.conf; file render menimpa nilai di sini.
$tint   = rgba(17, 20, 24, 0.45)
