# TEMPLATE Noctalia -> ~/.config/hypr/hyprlock-colors.conf (dideklarasikan di noctalia/hyprlock.toml).
# Variabel hyprlang untuk ~/.config/hypr/hyprlock.conf; warna Material 3 dari palet wallpaper, format rgba(r, g, b, a).
$tint   = {{ colors.surface.default.rgba | set_alpha 0.45 }}
$box    = {{ colors.surface_variant.default.rgba | set_alpha 0.6 }}
$fg     = {{ colors.on_surface.default.rgba | set_alpha 1.0 }}
$fg_dim = {{ colors.on_surface_variant.default.rgba | set_alpha 1.0 }}
$accent = {{ colors.primary.default.rgba | set_alpha 1.0 }}
$border = {{ colors.outline_variant.default.rgba | set_alpha 0.5 }}
$error  = {{ colors.error.default.rgba | set_alpha 1.0 }}
