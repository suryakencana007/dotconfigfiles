# Lock screen Noctalia (Super+Ctrl+L / `noctalia msg session lock`).
# Referensi kunci: https://docs.noctalia.dev/noctalia/configuration/shell/ (bagian [lockscreen]).
# Kotak login: blok [lockscreen_widgets] diterima `noctalia config validate`; editor visual
# `noctalia msg lockscreen-widgets-edit` menulis nilai yang sama ke state
# ~/.local/state/noctalia/settings.toml, dan state menang atas file ini kalau kuncinya sama.

[lockscreen]
blurred_desktop = true   # latar = desktop saat ini, diblur (bukan wallpaper polos)
blur_intensity = 0.6     # 0.0-1.0, default 0.5
tint_intensity = 0.3     # 0.0-1.0, default 0.3

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@Unknown-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@Unknown-1"]
    box_height = 196.0
    box_width = 480.0   # compact; semula 810
    cx = 960.0               # tengah horizontal layar 1920x1080
    cy = 540.0               # tengah vertikal (bawaan 898 = dekat bawah)
    output = "Unknown-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Unknown-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.6   # bawaan 0.88; lebih tembus supaya blur terlihat
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "compact"         # alternatif: "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = false   # sembunyikan teks "Type your password and press Enter"
        show_weather = true
