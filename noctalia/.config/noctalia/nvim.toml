# Template user: warna Neovim ikut tema Noctalia (base16). Aktif begitu entri ini ada.
[theme.templates.user.nvim_base16]
input_path  = "~/.config/nvim/lua/noctalia-template.lua"
output_path = "~/.config/nvim/lua/noctalia.lua"
post_hook   = "pkill -SIGUSR1 nvim || true"   # nvim yang terbuka langsung ganti warna; tanpa error kalau nvim tidak jalan
